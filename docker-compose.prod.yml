version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: wellnessway-db-prod
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-wellnessway_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./backend/app/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    secrets:
      - postgres_user
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $(cat /run/secrets/postgres_user)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wellnessway-network-prod
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wellnessway-backend-prod
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql://$(cat /run/secrets/postgres_user):$(cat /run/secrets/postgres_password)@database:5432/${POSTGRES_DB:-wellnessway_db}
    ports:
      - "8000:8000"
    secrets:
      - postgres_user
      - postgres_password
      - secret_key
      - openai_api_key
      - sentry_dsn
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - wellnessway-network-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # React Frontend (Production Build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wellnessway-frontend-prod
    environment:
      - REACT_APP_API_URL=https://api.wellnessway.com
      - REACT_APP_ENVIRONMENT=production
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - wellnessway-network-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # Redis (for caching and session storage)
  redis:
    image: redis:7-alpine
    container_name: wellnessway-redis-prod
    command: redis-server --requirepass $(cat /run/secrets/redis_password)
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "$(cat /run/secrets/redis_password)", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - wellnessway-network-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: wellnessway-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - wellnessway-network-prod
    restart: unless-stopped

secrets:
  postgres_user:
    external: true
  postgres_password:
    external: true
  secret_key:
    external: true
  openai_api_key:
    external: true
  sentry_dsn:
    external: true
  redis_password:
    external: true

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  nginx_logs:
    driver: local

networks:
  wellnessway-network-prod:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16