name: Performance Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run performance tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  # Backend Performance Tests
  backend-performance:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_wellnessway_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install locust pytest-benchmark

    - name: Set up environment
      run: |
        echo "DATABASE_URL=postgresql://test_user:test_password@localhost:5432/test_wellnessway_db" >> $GITHUB_ENV
        echo "SECRET_KEY=test-secret-key-for-performance" >> $GITHUB_ENV
        echo "DEBUG=false" >> $GITHUB_ENV
        echo "ENVIRONMENT=testing" >> $GITHUB_ENV

    - name: Run database migrations
      working-directory: ./backend
      run: |
        alembic upgrade head

    - name: Start backend server
      working-directory: ./backend
      run: |
        uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 10

    - name: Run performance benchmarks
      working-directory: ./backend
      run: |
        # Run pytest benchmarks
        pytest tests/performance/ -v --benchmark-only --benchmark-json=benchmark-results.json

    - name: Run load tests with Locust
      working-directory: ./backend
      run: |
        # Create a simple locustfile for API load testing
        cat > locustfile.py << 'EOF'
        from locust import HttpUser, task, between
        
        class WellnessWayUser(HttpUser):
            wait_time = between(1, 3)
            
            @task(3)
            def health_check(self):
                self.client.get("/health")
            
            @task(1)
            def api_docs(self):
                self.client.get("/docs")
        EOF
        
        # Run load test
        locust --headless --users 50 --spawn-rate 5 --run-time 60s --host http://localhost:8000 --html performance-report.html

    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: backend-performance-results
        path: |
          backend/benchmark-results.json
          backend/performance-report.html

  # Frontend Performance Tests
  frontend-performance:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      working-directory: ./frontend
      run: |
        npm ci
        npm install -g lighthouse @lhci/cli

    - name: Build frontend
      working-directory: ./frontend
      run: |
        npm run build

    - name: Start frontend server
      working-directory: ./frontend
      run: |
        npx serve -s build -l 3000 &
        sleep 10

    - name: Run Lighthouse CI
      working-directory: ./frontend
      run: |
        lhci autorun --config=.lighthouserc.json || true

    - name: Bundle size analysis
      working-directory: ./frontend
      run: |
        npx webpack-bundle-analyzer build/static/js/*.js --report --mode static --report-filename bundle-report.html

    - name: Upload frontend performance results
      uses: actions/upload-artifact@v3
      with:
        name: frontend-performance-results
        path: |
          frontend/.lighthouseci/
          frontend/bundle-report.html

  # Database Performance Tests
  database-performance:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_wellnessway_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pgbench

    - name: Run database migrations
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_wellnessway_db
      run: |
        alembic upgrade head

    - name: Run database performance tests
      run: |
        # Initialize pgbench
        pgbench -i -s 10 -h localhost -p 5432 -U test_user test_wellnessway_db
        
        # Run performance test
        pgbench -c 10 -j 2 -t 1000 -h localhost -p 5432 -U test_user test_wellnessway_db > db-performance-results.txt

    - name: Upload database performance results
      uses: actions/upload-artifact@v3
      with:
        name: database-performance-results
        path: db-performance-results.txt