name: Build and Deploy to Cloud Run

on:
  push:
    branches: [ dev ]
  workflow_dispatch: # Manual trigger as requested

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1 # Change to your preferred region
  SERVICE_NAME: wellness-way-backend
  REPOSITORY: wellness-way-repo
  # Map secrets to env for better troubleshooting and safe expansion
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
  JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  REDIS_URL: ${{ secrets.REDIS_URL }}
  ENABLE_ML_PIPELINE: ${{ secrets.ENABLE_ML_PIPELINE }}
  ENABLE_EMAIL_NOTIFICATIONS: ${{ secrets.ENABLE_EMAIL_NOTIFICATIONS }}
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
  ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
  APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
  CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
  TRUSTED_HOSTS: ${{ secrets.TRUSTED_HOSTS }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          IMAGE=us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker build -t $IMAGE -f backend/Dockerfile backend
          docker push $IMAGE

      - name: Deploy to Cloud Run
        run: |
          # Use shell variables ($VAR) instead of direct GitHub expression expansion to avoid shell injection issues
          # Semicolon is our delimiter for gcloud (using ^;^) and our backend parser
          # This is the ONLY way to prevent commas in secrets from truncating your config!
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --timeout 300 \
            --set-env-vars "^|^ENVIRONMENT=production" \
            --set-env-vars "^|^DEBUG=false" \
            --set-env-vars "^|^DATABASE_URL=$DATABASE_URL" \
            --set-env-vars "^|^SUPABASE_URL=$SUPABASE_URL" \
            --set-env-vars "^|^SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" \
            --set-env-vars "^|^GROQ_API_KEY=$GROQ_API_KEY" \
            --set-env-vars "^|^OPENAI_API_KEY=$OPENAI_API_KEY" \
            --set-env-vars "^|^AI_PROVIDER=$AI_PROVIDER" \
            --set-env-vars "^|^SECRET_KEY=$SECRET_KEY" \
            --set-env-vars "^|^JWT_SECRET_KEY=$JWT_SECRET_KEY" \
            --set-env-vars "^|^GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" \
            --set-env-vars "^|^GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" \
            --set-env-vars "^|^REDIS_URL=$REDIS_URL" \
            --set-env-vars "^|^ENABLE_ML_PIPELINE=$ENABLE_ML_PIPELINE" \
            --set-env-vars "^|^ENABLE_EMAIL_NOTIFICATIONS=$ENABLE_EMAIL_NOTIFICATIONS" \
            --set-env-vars "^|^SMTP_HOST=$SMTP_HOST" \
            --set-env-vars "^|^SMTP_PORT=$SMTP_PORT" \
            --set-env-vars "^|^SMTP_USER=$SMTP_USER" \
            --set-env-vars "^|^SMTP_PASSWORD=$SMTP_PASSWORD" \
            --set-env-vars "^|^FROM_EMAIL=$FROM_EMAIL" \
            --set-env-vars "^|^ADMIN_EMAIL=$ADMIN_EMAIL" \
            --set-env-vars "^|^APP_BASE_URL=$APP_BASE_URL" \
            --set-env-vars "^|^CORS_ORIGINS=$CORS_ORIGINS" \
            --set-env-vars "^|^TRUSTED_HOSTS=$TRUSTED_HOSTS"

      - name: Output Deployment Info
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format 'value(status.url)'
